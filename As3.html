<!DOCTYPE html>
<html lang="en">
<head>
   <title>Calculator</title>
   <link rel="stylesheet" href="as3.css">
</head>
<body>
   <div id="calc">
      <div id="content">
         <form>
            <div id="output">
               <input type="text" id="res" readonly>
            </div>
            <div class="btn">
               <input type="button" value="C" onclick="Clear()" id="clear" class="operator">
               <input type="button" value="←" onclick="Back()" id="backspace" class="operator">
               <input type="button" value="%" onclick="Solve('%')" class="operator">
               <input type="button" value="÷" onclick="Solve('/')" class="operator">
               <br>
               <input type="button" value="7" onclick="Solve('7')" class="num">
               <input type="button" value="8" onclick="Solve('8')" class="num">
               <input type="button" value="9" onclick="Solve('9')" class="num">
               <input type="button" value="×" onclick="Solve('*')" class="operator">
               <br>
               <input type="button" value="4" onclick="Solve('4')" class="num">
               <input type="button" value="5" onclick="Solve('5')" class="num">
               <input type="button" value="6" onclick="Solve('6')" class="num">
               <input type="button" value="-" onclick="Solve('-')" class="operator">
               <br>
               <input type="button" value="1" onclick="Solve('1')" class="num">
               <input type="button" value="2" onclick="Solve('2')" class="num">
               <input type="button" value="3" onclick="Solve('3')" class="num">
               <input type="button" value="+" onclick="Solve('+')" class="operator">
               <br>
               <input type="button" value="00" onclick="Solve('00')" class="num">
               <input type="button" value="0" onclick="Solve('0')" class="num">
               <input type="button" value="." onclick="Solve('.')" class="num">
               <input type="button" value="=" onclick="Result()" id="equal">
            </div>
         </form>
      </div>
   </div>
   <script src="as3.js"></script>
</body>
</html>
